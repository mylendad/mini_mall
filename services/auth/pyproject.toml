[project]
name = "auth-service"
version = "0.1.0"
description = "Autonomous Authentication Service"
requires-python = ">=3.12"
dependencies = [
    "common>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.27",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "testcontainers>=4.7.1",
    "ruff>=0.2.2",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.uv.sources]
common = { path = "../../libs/common", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "app.*"]
